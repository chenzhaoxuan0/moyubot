# 桌面安装包发布 —— push v* tag 触发；手动 dispatch 只构建不发布（验证打包链路用）。
#
# 产物口径（与 electron-builder.yml 同源）：一个平台一份安装包，不带任何 agent
# CLI（claude.exe / pi-coding-agent 不进包，PATH 里装了什么就管理什么）。
# 每包 ≈ Electron 运行时 + 前端 dist + daemon-deploy（bundle + 原生模块）。
#
# 签名现状：无证书（mac identity: null，win 跳过签名）——用户首启会撞
# SmartScreen / Gatekeeper，属已知取舍，README 有说明。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
          - os: macos-latest
            builder-args: --mac
          - os: ubuntu-latest
            builder-args: --linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            prototype/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install deps (root / prototype / backend)
        run: |
          pnpm install --frozen-lockfile
          pnpm -C prototype install --frozen-lockfile
          pnpm -C backend install --frozen-lockfile

      # electron-builder 打包时另下一份 electron zip（与 node_modules 里的运行时分开），
      # 缓存它三平台各省 ~100MB/次下载
      - name: Cache electron-builder downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Build frontend + daemon bundle
        run: pnpm dist:prepare

      - name: Package installers
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error

  release:
    name: create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh installers/
          gh release create "${GITHUB_REF_NAME}" installers/* \
            --title "MoyuBot ${GITHUB_REF_NAME}" \
            --generate-notes
