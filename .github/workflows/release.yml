# 桌面安装包发布 —— push v* tag 触发；手动 dispatch 只构建不发布（验证打包链路用）。
#
# 产物口径（与 electron-builder.yml 同源）：一个平台一份安装包，不带任何 agent
# CLI（claude.exe / pi-coding-agent 不进包，PATH 里装了什么就管理什么）。
# 每包 ≈ Electron 运行时 + 前端 dist + daemon-deploy（bundle + 原生模块）。
#
# 签名现状：无证书（mac identity: null，win 跳过签名）——用户首启会撞
# SmartScreen / Gatekeeper，属已知取舍，README 有说明。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: --win
          - os: macos-latest
            builder-args: --mac
          - os: ubuntu-latest
            builder-args: --linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            prototype/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install deps (root / prototype / backend)
        run: |
          pnpm install --frozen-lockfile
          pnpm -C prototype install --frozen-lockfile
          pnpm -C backend install --frozen-lockfile

      # electron-builder 打包时另下一份 electron zip（与 node_modules 里的运行时分开），
      # 缓存它三平台各省 ~100MB/次下载。restore-keys 前缀回退：精确 key（含
      # package.json 哈希，版本号一 bump 就换）未命中时复用最近一次成功的同平台缓存
      # —— electron 与配套二进制钉在 lockfile 版本上，跨小版本依然全部可用，
      # 下载端（GitHub 资产 CDN / 镜像）故障时打包完全不受影响（2026-11-08 实测）
      - name: Cache electron-builder downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-dl-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-dl-${{ runner.os }}-

      - name: Build frontend + daemon bundle
        run: pnpm dist:prepare

      # 下载端连通性诊断（2026-11-08 v0.1.2 发版排障加）：electron zip 与
      # electron-builder-binaries 资产分别测 GitHub 源与 npmmirror 镜像
      # （小范围探测 + 镜像全量下载计时），504 排查时一眼看出挂的是哪条链路
      # （不阻断流程）
      - name: Probe download endpoints
        run: |
          probe() { code=$(curl -sL -o /dev/null -w "%{http_code}" -m 30 --range 0-1023 "$1"); echo "$code  $1"; }
          probe "https://github.com/electron/electron/releases/download/v44.6.0/electron-v44.6.0-linux-x64.zip" || true
          probe "https://github.com/electron-userland/electron-builder-binaries/releases/download/appimage-12.0.1/appimage-12.0.1.7z" || true
          probe "https://npmmirror.com/mirrors/electron-builder-binaries/appimage-12.0.1/appimage-12.0.1.7z" || true
          echo "镜像全量下载计时（5MB）:"
          curl -sL -o /dev/null -w "  %{http_code}  %{size_download}B  %{time_total}s  npmmirror appimage 全量\n" -m 180 "https://npmmirror.com/mirrors/electron-builder-binaries/appimage-12.0.1/appimage-12.0.1.7z" || true

      - name: Package installers
        env:
          # 全量走 npmmirror（官方资产镜像）：electron zip 用 ELECTRON_MIRROR、
          # 配套二进制（winCodeSign / nsis / appimage…）用 BINARIES_MIRROR ——
          # 两者默认都从 github.com release 资产下载，该 CDN 故障时打包全军覆没
          # （2026-11-08 v0.1.2 实测：三平台 504 持续一小时+，探针显示 GitHub
          # 源连 electron zip 都 504 而 npmmirror 可达）。已下载资产落 Cache 后
          # 正常时期零额外开销（见上方 cache 步骤）
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        # 下载类失败做退避重试（已完成的下载在 Cache 里，重试从断点资产继续）
        run: |
          for i in 1 2 3; do
            pnpm exec electron-builder ${{ matrix.builder-args }} --publish never && exit 0
            echo "第 $i 次打包失败，$((i * 60))s 后重试"
            sleep $((i * 60))
          done
          exit 1

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.AppImage
            dist-electron/*.deb
          if-no-files-found: error

  release:
    name: create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh installers/
          gh release create "${GITHUB_REF_NAME}" installers/* \
            --title "MoyuBot ${GITHUB_REF_NAME}" \
            --generate-notes
